name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homeassistant-addon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (exact pins from requirements.txt)
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
